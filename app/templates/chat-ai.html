{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Physics Hub{% endblock %}

{% block content %}
<div class="chat-container">
  <div class="chat-wrapper">
    <div class="chat-messages" id="messages">
      <p class="chat-message">Assalomu alaykum!</p>
    </div>
  </div>

  <div class="chat-footer">
    <form id="chat-form" class="chat-form">
      <input type="text" name="message" placeholder="Xabar..." autocomplete="off" class="chat-input">
      <button type="submit" class="chat-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
          class="bi bi-arrow-up-square-fill" viewBox="0 0 16 16">
          <path
            d="M2 16a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2zm6.5-4.5V5.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 5.707V11.5a.5.5 0 0 0 1 0" />
        </svg>
      </button>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById('chat-form');
  const input = form.querySelector('input[name="message"]');
  const messages = document.getElementById('messages');

  function simulateTyping(message, targetElement) {
    let i = 0;
    const typingSpeed = 50;
    targetElement.innerHTML = '';
    const interval = setInterval(() => {
      targetElement.innerHTML = marked.parse(message.substring(0, i + 1));
      i++;
      if (i >= message.length) {
        clearInterval(interval);
      }
    }, typingSpeed);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    const userMessage = document.createElement('p');
    userMessage.className = 'chat-message user';
    userMessage.textContent = text;
    messages.appendChild(userMessage);
    input.disabled = true;
    window.scrollTo(0, document.body.scrollHeight);

    try {
      const response = await fetch('https://api.u2s.uz/physics-ai?savol=' + encodeURIComponent(text));
      if (!response.ok) throw new Error('Server error');
      const data = await response.json();

      const aiMessage = document.createElement('p');
      aiMessage.className = 'chat-message';

      const typingIndicator = document.createElement('p');
      typingIndicator.className = 'chat-typing';
      typingIndicator.textContent = 'AI yozmoqda...';
      messages.appendChild(typingIndicator);
      window.scrollTo(0, document.body.scrollHeight);

      const parsedMessage = data.javob;

      setTimeout(() => {
        simulateTyping(parsedMessage, aiMessage);
        messages.appendChild(aiMessage);
        typingIndicator.remove();
      }, 500);
    } catch (err) {
      console.error(err);
      const errorMessage = document.createElement('p');
      errorMessage.className = 'chat-message';
      errorMessage.textContent = 'Xatolik yuz berdi. Iltimos, qayta urinib ko‘ring.';
      messages.appendChild(errorMessage);
    } finally {
      input.disabled = false;
      input.value = '';
      input.focus();
      window.scrollTo(0, document.body.scrollHeight);
    }
  });
</script>
{% endblock %}

{% block page_content %}
{{wtf.quick_form(form)}}
{% endblock %}
