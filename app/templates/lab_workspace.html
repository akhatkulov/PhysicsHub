{% extends "base.html" %}

{% block title %}Laboratoriya Ishchi stoli - Physics Hub{% endblock %}

{% block content %}
<div class="lab-workspace"
    style="height: calc(100vh - 200px); display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);">
    <div class="workspace-header"
        style="padding: 10px 20px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: space-between;">
        <a href="{{ url_for('main.lab_list_view') }}" class="btn-back"
            style="text-decoration: none; color: white; font-weight: bold; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-arrow-left"></i> Orqaga
        </a>
        <h2 style="color: white; margin: 0; font-size: 18px;">{{ title }}</h2>
        <div style="width: auto;">
            <button id="fullscreen-btn" class="btn" style="background: transparent; border: 1px solid rgba(255,255,255,0.5); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-size: 14px;">
                <i class="fas fa-expand"></i> Kattalashtirish
            </button>
        </div>
    </div>

    <div id="lab-container" class="workspace-content" style="flex: 1; position: relative; overflow: hidden; background: white;">
        <iframe src="{{ src }}" style="width: 100%; height: 100%; border: none; background: white;"
            allowfullscreen></iframe>
    </div>
</div>

<style>
    .btn-back:hover {
        color: #ffcc00 !important;
    }
    #fullscreen-btn:hover {
        background: rgba(255,255,255,0.1) !important;
        border-color: white !important;
    }
    /* Hide button in fullscreen inside the lab-container */
    #lab-container:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
    }
    #lab-container:fullscreen {
        width: 100vw;
        height: 100vh;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const labContainer = document.getElementById('lab-container');

        fullscreenBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                if (labContainer.requestFullscreen) {
                    labContainer.requestFullscreen();
                } else if (labContainer.webkitRequestFullscreen) { /* Safari */
                    labContainer.webkitRequestFullscreen();
                } else if (labContainer.msRequestFullscreen) { /* IE11 */
                    labContainer.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        });

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Kattalashtirish';
            } else {
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Kichiklashtirish';
            }
        });
    });
</script>
{% endblock %}
