{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block content %}
<section class="theme-section">
    <h1 class="form-action-title">Bilimlar Sinovi</h1>
    <div class="theme-grid">
        {% for theme in themes %}
        <div class="theme-card">
            <a href="/tests/{{ theme.name | lower }}">
                <div class="icon-wrap">
                    <i class="fas fa-vial"></i>
                </div>
                <h3 class="theme-name">{{ theme.name | capitalize }}</h3>
                <p class="theme-about">{{ theme.about }}</p>
                <div style="margin-top: auto; padding-top: 20px;">
                    <span class="btn-primary" style="padding: 10px 20px; font-size: 14px; display: inline-flex;">
                        Testlarni boshlash <i class="fas fa-play"></i>
                    </span>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
