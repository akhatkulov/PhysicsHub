{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block content %}
<div class="theme-list">
    <h2>{{name | capitalize}} | Masalalar ro'yxati</h2>
    <ul id="theme-list">
        {% for test in tests %}
            <li>
                <a href="/tests/{{name}}/{{test.id}}">
                    <strong class="theme-name">{{ test.title | capitalize }}</strong>: 
                </a>
            </li>
        {% endfor %}
    </ul>

</div>


{% endblock %}

{% block page_content %}
{{wtf.quick_form(form)}}
{% endblock %}
