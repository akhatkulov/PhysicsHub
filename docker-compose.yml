version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: physicshub_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-physicshub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-physicshub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-physicshub}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: physicshub_web
    restart: always
    environment:
      - FLASK_APP=flasky.py
      - FLASK_CONFIG=${FLASK_CONFIG:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - DATABASE_URL=postgresql://${DB_USER:-physicshub}:${DB_PASSWORD}@db:5432/${DB_NAME:-physicshub}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: physicshub_db_backup
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME:-physicshub}
      - POSTGRES_USER=${DB_USER:-physicshub}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
